[build-system]
requires = [ "setuptools>=77",]
build-backend = "setuptools.build_meta"

[project]
name = "nltlog"
version = "1.1.6"
description = "Small Loguru helper for named rotating log files"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = [ "LICENSE",]
keywords = [ "logging", "loguru", "rotation",]
classifiers = [ "Intended Audience :: Developers", "Operating System :: OS Independent", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only", "Topic :: System :: Logging",]
dependencies = [ "loguru>=0.7.3",]
[[project.authors]]
name = "niuliangtao"
email = "farfarfun@qq.com"

[project.urls]
Homepage = "https://github.com/farfarfun/nltlog"
Repository = "https://github.com/farfarfun/nltlog.git"
Issues = "https://github.com/farfarfun/nltlog/issues"

[tool.ruff]
target-version = "py39"
