[build-system]
requires = [ "setuptools>=77",]
build-backend = "setuptools.build_meta"

[project]
name = "farlog"
version = "1.1.7"
description = "Small Loguru helper for named rotating log files"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = [ "logging", "loguru", "rotation",]
classifiers = [ "Intended Audience :: Developers", "Operating System :: OS Independent", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only", "Topic :: System :: Logging",]
dependencies = [ "loguru>=0.7.3",]
[[project.authors]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.authors]]
name = "farfarfun"
email = "farfarfun@qq.com"
[project.urls]
Organization = "https://github.com/farfarfun"
Repository = "https://github.com/farfarfun/farlog"
Releases = "https://github.com/farfarfun/farlog/releases"

[[project.maintainers]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.maintainers]]
name = "farfarfun"
email = "farfarfun@qq.com"
[tool.ruff]
target-version = "py39"
